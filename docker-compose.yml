# ─────────────────────────────────────────────────────────────────────────────
# CaféSmart — production self-hosted stack
# ─────────────────────────────────────────────────────────────────────────────
#   db  : PostgreSQL 16 (persistent volume, localhost-only port)
#   ml  : FastAPI inference service (internal-only, no published ports)
#   app : Next.js standalone + Socket.io (validates env, serves :3000)
#
# Usage:
#   1. cp .env.example .env   # then fill secrets (POSTGRES_PASSWORD required)
#   2. docker compose up -d --build
#   3. Apply DB migrations from the host (needs direct DB access):
#        $env:DATABASE_URL="postgresql://cafesmart:<pw>@localhost:5432/cafesmart?sslmode=disable"
#        npx prisma migrate deploy
#   4. Open http://localhost:3000 (or your AUTH_URL host)
#
# Notes:
# - Compose auto-loads `.env` from this directory for ${VAR} interpolation.
# - The app container does NOT co-host ML here (DISABLE_ML_COHOST=true);
#   it reaches the split service at http://ml:8000. Single-container
#   deploys via the root Dockerfile still co-host by default.
# - Ports bind to 127.0.0.1 only. Put a reverse proxy (Caddy/Nginx +
#   TLS) in front for public traffic; never expose Postgres publicly.
# ─────────────────────────────────────────────────────────────────────────────
name: cafesmart

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cafesmart}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env — refusing to boot with an empty DB password}
      POSTGRES_DB: ${POSTGRES_DB:-cafesmart}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Localhost-only: lets the operator run `prisma migrate deploy`
      # from the host without exposing Postgres to the network.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cafesmart} -d ${POSTGRES_DB:-cafesmart}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  ml:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      ML_SERVICE_PORT: 8000
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      ml:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      DISABLE_ML_COHOST: "true"
      ML_SERVICE_URL: http://ml:8000
      ML_SERVICE_PORT: 8000
      DATABASE_URL: postgresql://${POSTGRES_USER:-cafesmart}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-cafesmart}?sslmode=disable
      # Passed through from .env (entrypoint fails fast if required ones are empty)
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_URL: ${AUTH_URL}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET}
      PAYHERE_MERCHANT_ID: ${PAYHERE_MERCHANT_ID}
      PAYHERE_MERCHANT_SECRET: ${PAYHERE_MERCHANT_SECRET}
      NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL}
      CRON_SECRET: ${CRON_SECRET}
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - uploads:/app/uploads

volumes:
  pgdata:
    name: cafesmart-pgdata
  uploads:
    name: cafesmart-uploads
